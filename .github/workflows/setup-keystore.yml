name: Setup Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if keystore already exists
        id: check
        run: |
          if [ -f debug.keystore ]; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate keystore
        if: steps.check.outputs.EXISTS == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Commit keystore to repo
        if: steps.check.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f debug.keystore
          git commit -m "Add permanent debug keystore [skip ci]"
          git push

      - name: Verify
        run: |
          if [ -f debug.keystore ]; then
            echo "✅ debug.keystore sudah ada di repo"
            ls -la debug.keystore
          else
            echo "❌ debug.keystore belum ada"
            exit 1
          fi

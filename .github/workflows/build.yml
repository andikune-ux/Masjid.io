name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Fix gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kotlin.daemon.jvmargs=-Xmx2048m
          android.lint.abortOnError=false
          EOF

      - name: Fix local.properties
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Verify keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore tidak ada di repo!"
            echo "Jalankan workflow 'Setup Keystore' dulu."
            exit 1
          fi
          echo "✅ Keystore ditemukan: $(wc -c < debug.keystore) bytes"

      - name: Create google-services.json
        run: |
          PKG="com.example"
          if [ -f app/build.gradle.kts ]; then
            DETECTED=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | head -1 | tr -d '"')
            if [ -n "$DETECTED" ]; then PKG="$DETECTED"; fi
          fi
          cat > app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate gradlew wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Extract version info
        id: version
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" 2>/dev/null | sort -r | head -1)
          VERSION=""
          if [ -n "$AAPT" ]; then
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            if [ -n "$APK" ]; then
              VERSION=$($AAPT dump badging "$APK" 2>/dev/null | grep "versionName" | head -1 | sed "s/.*versionName='//" | sed "s/'.*//")
            fi
          fi
          if [ -z "$VERSION" ]; then VERSION="V1.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected version: $VERSION"

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: masjid-io-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Membuat release untuk tag: $VERSION"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "⚠️ Release $VERSION sudah ada, skip."
          else
            gh release create "$VERSION" \
              --title "MASJID.IO $VERSION" \
              --notes "## Update MASJID.IO $VERSION

          Build otomatis dari commit ${{ github.sha }}

          ### Cara Install
          1. Download APK di bawah
          2. Install di Android TV
          3. Selesai" \
              app/build/outputs/apk/debug/*.apk
            echo "✅ Release $VERSION berhasil dibuat!"
          fi

      - name: Reset unstaged changes
        if: success()
        run: |
          # Buang perubahan file yang dimodifikasi workflow (gradle.properties, dll)
          git checkout -- . 2>/dev/null || true
          git clean -fd gradle.properties local.properties app/google-services.json 2>/dev/null || true

      - name: Commit version.properties
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch dulu biar HEAD update
          git fetch origin main

          # Stage HANYA version.properties
          git add version.properties

          if git diff --staged --quiet; then
            echo "ℹ️ Tidak ada perubahan di version.properties"
          else
            echo "📝 Version.properties berubah, commit + push..."
            git commit -m "chore: update version.properties [skip ci]"

            # Rebase dengan remote (unstaged sudah dibersihkan di step sebelumnya)
            git pull --rebase origin main || true

            # Push
            git push origin HEAD:main
            echo "✅ version.properties berhasil di-push"
          fi

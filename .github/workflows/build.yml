name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      # FIX: gradle.properties tanpa properti deprecated
      - name: Fix gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          # JVM Settings
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          
          # AndroidX (tanpa jetifier & buildconfig karena sudah deprecated)
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          
          # Kotlin
          kotlin.code.style=official
          kotlin.daemon.jvmargs=-Xmx2048m
          
          # Bypass lint error
          android.lint.abortOnError=false
          EOF
          echo "=== gradle.properties ready ==="
          cat gradle.properties

      - name: Fix local.properties
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Generate debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create google-services.json
        run: |
          PKG="com.example"
          if [ -f app/build.gradle.kts ]; then
            DETECTED=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | head -1 | tr -d '"')
            if [ -n "$DETECTED" ]; then PKG="$DETECTED"; fi
          fi
          echo "Package detected: $PKG"
          
          cat > app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate gradlew wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: masjid-io-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
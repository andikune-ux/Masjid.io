name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Fix gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          kotlin.daemon.jvmargs=-Xmx2048m
          android.lint.abortOnError=false
          EOF

      - name: Fix local.properties
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Verify keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore tidak ada di repo!"
            exit 1
          fi
          echo "✅ Keystore ditemukan: $(wc -c < debug.keystore) bytes"

      - name: Create google-services.json
        run: |
          PKG="com.example"
          if [ -f app/build.gradle.kts ]; then
            DETECTED=$(grep -E 'applicationId\s*=' app/build.gradle.kts | head -1 | grep -o '"[^"]*"' | head -1 | tr -d '"')
            if [ -n "$DETECTED" ]; then PKG="$DETECTED"; fi
          fi
          cat > app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Generate gradlew wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show version info
        run: |
          echo "🔢 GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "📅 Day (WIB): $(TZ='Asia/Jakarta' date +%d)"
          echo "🎯 Expected version: V1.$(TZ='Asia/Jakarta' date +%d).${GITHUB_RUN_NUMBER}"

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Extract version info
        id: version
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" 2>/dev/null | sort -r | head -1)
          VERSION=""
          if [ -n "$AAPT" ]; then
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
            if [ -n "$APK" ]; then
              VERSION=$($AAPT dump badging "$APK" 2>/dev/null | grep "versionName" | head -1 | sed "s/.*versionName='//" | sed "s/'.*//")
            fi
          fi
          if [ -z "$VERSION" ]; then VERSION="V1.0.0"; fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected version from APK: $VERSION"

      # ============================================================
      # V1.30.6 BARU — Extract Changelog dari UpdateHistory.kt
      # ============================================================
      - name: Extract Changelog
        id: changelog
        run: |
          echo "📝 Extract changelog dari UpdateHistory.kt..."

          HISTORY_FILE="app/src/main/java/com/example/data/UpdateHistory.kt"
          NOTES_FILE="release_notes.txt"

          if [ ! -f "$HISTORY_FILE" ]; then
            echo "⚠️ UpdateHistory.kt tidak ditemukan"
            echo "notes=📋 Update tersedia. Lihat detail di GitHub Release." >> $GITHUB_OUTPUT
            exit 0
          fi

          # Ambil versi dari APK, contoh: V1.03.374
          # Konversi ke format UpdateHistory, contoh: V1.30.6
          # UpdateHistory pakai format V1.XX.Y, jadi ambil manual
          # Ambil entry PERTAMA (paling atas) dari UpdateHistory

          # Ambil baris pertama updateEntry (paling baru)
          FIRST_VERSION=$(grep -m 1 'version = "V' "$HISTORY_FILE" | sed 's/.*"\(V[^"]*\)".*/\1/')
          FIRST_DATE=$(grep -m 1 'date = "' "$HISTORY_FILE" | sed 's/.*"\([^"]*\)".*/\1/')
          FIRST_TITLE=$(grep -m 1 'title = "' "$HISTORY_FILE" | sed 's/.*"\([^"]*\)".*/\1/')

          echo "✅ Versi terbaru di UpdateHistory: $FIRST_VERSION"
          echo "✅ Judul: $FIRST_TITLE"

          # Extract features (semua baris "- ..." di dalam entry pertama)
          # Batasi sampai entry berikutnya (find 2nd "UpdateEntry(")
          awk '
            BEGIN { entry_count = 0; in_features = 0 }
            /UpdateEntry\(/ { entry_count++; if (entry_count > 1) exit }
            entry_count == 1 && /features = listOf\(/ { in_features = 1; next }
            entry_count == 1 && in_features && /^\s*\)\s*$/ { in_features = 0 }
            entry_count == 1 && in_features {
              gsub(/^\s*"/, "", $0)
              gsub(/",?\s*$/, "", $0)
              if (length($0) > 0) print "- " $0
            }
          ' "$HISTORY_FILE" > features.txt

          FEATURE_COUNT=$(wc -l < features.txt)
          echo "📊 Total fitur: $FEATURE_COUNT"

          # Buat release notes
          {
            echo "## 🎉 MASJID.IO $FIRST_VERSION"
            echo ""
            echo "**$FIRST_TITLE**"
            echo ""
            echo "📅 Tanggal: $FIRST_DATE"
            echo ""
            echo "### 📋 Yang Baru & Diperbaiki:"
            echo ""
            cat features.txt
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Cara Install"
            echo ""
            echo "1. Download APK di bawah (di assets)"
            echo "2. Install di Android TV / HP"
            echo "3. Selesai — data lama tetap tersimpan"
            echo ""
            echo "### 🔧 Detail Build"
            echo ""
            echo "- Build otomatis dari commit \`${{ github.sha }}\`"
            echo "- Workflow run #${{ github.run_number }}"
            echo "- Versi aplikasi: \`${{ steps.version.outputs.VERSION }}\`"
          } > "$NOTES_FILE"

          echo "✅ Release notes tersimpan:"
          head -20 "$NOTES_FILE"

          # Simpan path file ke output
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: masjid-io-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="${{ steps.changelog.outputs.notes_file }}"

          echo "🚀 Membuat release untuk tag: $VERSION"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "⚠️ Release $VERSION sudah ada, hapus dulu..."
            gh release delete "$VERSION" --yes || true
            sleep 2
          fi

          if [ -f "$NOTES_FILE" ]; then
            gh release create "$VERSION" \
              --title "MASJID.IO $VERSION" \
              --notes-file "$NOTES_FILE" \
              app/build/outputs/apk/debug/*.apk
          else
            echo "⚠️ Release notes file tidak ditemukan, pakai default..."
            gh release create "$VERSION" \
              --title "MASJID.IO $VERSION" \
              --notes "## Update MASJID.IO $VERSION

          Build otomatis dari commit ${{ github.sha }}

          ### Cara Install
          1. Download APK di bawah
          2. Install di Android TV / HP
          3. Selesai" \
              app/build/outputs/apk/debug/*.apk
          fi

          echo "✅ Release $VERSION berhasil dibuat!"
